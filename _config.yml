title: Kyuukei no Hanashi
email: ask@kyuukei.com
description: "Waking up for the first time with a floating orb beside her, where will their journey lead?"
url: https://kyuukei.com
baseurl: ""
option: a
palette: charcoal-blush
theme: null
markdown: kramdown
kramdown:
  input: Kramdown
permalink: pretty
plugins: []
collections:
  volumes:
    output: true
    permalink: /volumes/:name/
  news:
    output: true
    permalink: /news/:title/
defaults:
  - scope:
      path: ""
      type: volumes
    values:
      layout: volume
      kind: volume
  - scope:
      path: ""
      type: news
    values:
      layout: news-post
      kind: news-post
      published: true
exclude:
  - _concepts
  - _chapters
  - _characters
  - _questions
  - _stories
  - README.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - scripts
  - tests
  - docs
  - fourthwall
  - vendor
  - node_modules
