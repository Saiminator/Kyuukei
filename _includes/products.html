<section class="page-shell merchandise"><div class="section-heading"><div><h2>Featured Merchandise</h2></div></div><div class="product-grid">{% for product in site.data.products %}<article class="product-card"><div class="product-image"><img src="{{ product.image | default: '/assets/site/images/product.svg' | relative_url }}" width="800" height="600" alt="{% if product.image %}{{ product.name | escape }}{% else %}Product image for {{ product.name | escape }}{% endif %}" loading="lazy" decoding="async"></div><p class="eyebrow">{{ product.category }}</p><h3>{% if product.product_url %}<a href="{{ product.product_url }}">{{ product.name }} {% include arrow.html %}</a>{% else %}{{ product.name }}{% endif %}</h3></article>{% endfor %}</div></section>
